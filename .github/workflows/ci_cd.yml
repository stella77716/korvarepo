name: CI/CD - Korva Vitrine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: korva-vitrine
  DEPLOY_PORT: 8085

jobs:
  sast:
    name: SAST (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build:
    name: Build
    needs: sast
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --target production -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest .

  sca:
    name: SCA (Trivy)
    needs: build
    runs-on: self-hosted
    steps:
      - name: Install Trivy
        run: |
           if ! command -v trivy &> /dev/null; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          fi
      - name: Trivy scan (image)
        run: |
          trivy image --severity CRITICAL,HIGH --format json --output trivy-report.json ${{ env.IMAGE_NAME }}:${{ github.sha }}
          trivy image --severity CRITICAL,HIGH --exit-code 1 ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  deploy:
    name: Deploy
    needs: sca
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with docker compose
        run: docker compose -f docker-compose.yml up -d --force-recreate
        env:
          VITRINE_PORT: ${{ env.DEPLOY_PORT }}

  dast:
    name: DAST (OWASP ZAP)
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: ZAP Baseline Scan
        run: |
          docker run --rm --network host \
            -v $(pwd):/zap/wrk/:rw \
            zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:${{ env.DEPLOY_PORT }} \
            -J zap-report.json -r zap-report.html || true
      - name: Upload ZAP report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-report.json
            zap-report.html

  report:
    name: Rapport
    needs: [sast, build, sca, deploy, dast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build summary
        run: |
          {
            echo "## Rapport pipeline CI/CD - Korva Vitrine"
            echo ""
            echo "| Job | Statut |"
            echo "|---|---|"
            echo "| SAST (SonarCloud) | ${{ needs.sast.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| SCA (Trivy) | ${{ needs.sca.result }} |"
            echo "| Deploy | ${{ needs.deploy.result }} |"
            echo "| DAST (OWASP ZAP) | ${{ needs.dast.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Send report by email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Rapport pipeline CI/CD - ${{ github.repository }} - ${{ job.status }}"
          to: ${{ secrets.REPORT_EMAIL }}
          from: GitHub Actions
          body: |
            Pipeline terminé pour ${{ github.repository }} (commit ${{ github.sha }}).
            SAST: ${{ needs.sast.result }}
            Build: ${{ needs.build.result }}
            SCA: ${{ needs.sca.result }}
            Deploy: ${{ needs.deploy.result }}
            DAST: ${{ needs.dast.result }}
          attachments: artifacts/trivy-report/trivy-report.json,artifacts/zap-report/zap-report.html
